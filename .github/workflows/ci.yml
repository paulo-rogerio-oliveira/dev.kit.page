# CI do dev.kit.page: a cada push e PR, build e testes da API (.NET) e da web (React), os resultados
# publicados no PR (aba Checks) e como artefato, e o cenário ponta a ponta (Playwright) por cima dos dois.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  api:
    name: API (.NET)
    runs-on: ubuntu-latest
    env:
      DEVKIT_PAGE_DOCS_RAIZ: ${{ github.workspace }}/.fontes/dev.kit.docs/dev.kit.page
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - name: Documentação na revisão dos contratos de publicação
        uses: actions/checkout@v4
        with:
          repository: paulo-rogerio-oliveira/dev.kit.docs
          ref: b29bb0a9dea8e1ba303b8c22852c1e3e99439144
          token: ${{ secrets.REPO_KEY || github.token }}
          path: .fontes/dev.kit.docs
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: api/global.json
      - run: dotnet restore DevKitPage.slnx
      - run: dotnet build DevKitPage.slnx --no-restore -c Release
      - run: dotnet test DevKitPage.slnx --no-build -c Release --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-api
          path: api/TestResults
      # v2: a v1 quebrava ("stackTrace.split is not a function") ao ler o <failure message=...> (dorny/test-reporter#506).
      - uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Testes da API
          path: api/TestResults/*.trx
          reporter: dotnet-trx

  web:
    name: Web (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-web
          path: web/test-results
      - uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Testes da web
          path: web/test-results/vitest-junit.xml
          reporter: jest-junit

  e2e:
    name: Ponta a ponta (Playwright)
    needs: [api, web]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: api/global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-e2e
          path: |
            web/playwright-report
            web/test-results
